<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Shop everyday essentials, groceries and more with Blinkit.">
    <title>Blinkit | Groceries and essentials delivered fast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <nav class="navigation" aria-label="Main navigation">
            <form class="search" role="search" action="#">
                <label class="sr-only" for="site-search">Search for products</label>
                <span class="search-icon" aria-hidden="true"></span>
                <input id="site-search" type="search" placeholder="Search for atta, dal, coke and more">
            </form>
            <button class="cart-button" type="button">
                <span class="cart-icon" aria-hidden="true">▣</span>
                My Cart
            </button>
            <button class="login-button" type="button">Login</button>
            <a class="brand" href="#" aria-label="Blinkit home">blink<span>it</span></a>
        </nav>
    </header>

    <main>
        <div class="page-content">
            <section class="hero" aria-label="Daily essentials">
                <img src="assets/Frame-1437256605-2-2.jpg" alt="Stock up on daily essentials: fresh fruits, vegetables, eggs and more">
            </section>

            <section class="feature-cards" aria-label="More ways to shop">
                <a class="feature-card" href="#categories" aria-label="Shop pharmacy essentials">
                    <img src="assets/pharmacy-WEB.jpg" alt="Pharmacy at your doorstep">
                </a>
                <a class="feature-card" href="#categories" aria-label="Shop pet care supplies">
                    <img src="assets/pet_crystal_WEB-1.png" alt="Pet care supplies at your door">
                </a>
            </section>

            <section class="categories" id="categories" aria-labelledby="categories-heading">
                <div class="section-heading">
                    <h1 id="categories-heading">Shop by category</h1>
                    <p>Your everyday favourites, all in one place</p>
                </div>
                <div class="category-grid">
                    <a class="category-card" href="#categories"><img src="assets/Slice-2_10.png" alt="Dairy, bread and eggs"></a>
                    <a class="category-card" href="#categories"><img src="assets/Slice-3_9.png" alt="Fruits and vegetables"></a>
                    <a class="category-card" href="#categories"><img src="assets/Slice-4_9.png" alt="Cold drinks and juices"></a>
                    <a class="category-card" href="#categories"><img src="assets/Slice-5_4.png" alt="Snacks and munchies"></a>
                    <a class="category-card" href="#categories"><img src="assets/Slice-6_5.png" alt="Breakfast and instant food"></a>
                    <a class="category-card" href="#categories"><img src="assets/Slice-7_3.png" alt="Sweet treats"></a>
                    <a class="category-card" href="#categories"><img src="assets/Slice-8_4.png" alt="Bakery and biscuits"></a>
                    <a class="category-card" href="#categories"><img src="assets/Slice-7-1_0.png" alt="Tea, coffee and milk drinks"></a>
                    <a class="category-card" href="#categories"><img src="assets/Slice-10.png" alt="Atta, rice and dal"></a>
                    <a class="category-card" href="#categories"><img src="assets/paan-corner_web.jpg" alt="Paan corner"></a>
                    <a class="category-card" href="#categories"><img src="assets/pharmacy-WEB.jpg" alt="Pharmacy essentials"></a>
                    <a class="category-card" href="#categories"><img src="assets/pet_crystal_WEB-1.png" alt="Pet care essentials"></a>
                    <a class="category-card" href="#categories"><img src="assets/print_crystal_WEB.png" alt="Printout services"></a>
                    <a class="category-card" href="#categories"><img src="assets/baby_crystal_WEB-1.png" alt="Baby care essentials"></a>
                    <a class="category-card" href="#categories"><img src="assets/Slice-2_10.png" alt="Dairy, bread and eggs"></a>
                    <a class="category-card" href="#categories"><img src="assets/Slice-3_9.png" alt="Fruits and vegetables"></a>
                    <a class="category-card" href="#categories"><img src="assets/Slice-4_9.png" alt="Cold drinks and juices"></a>
                    <a class="category-card" href="#categories"><img src="assets/Slice-5_4.png" alt="Snacks and munchies"></a>
                    <a class="category-card" href="#categories"><img src="assets/Slice-6_5.png" alt="Breakfast and instant food"></a>
                    <a class="category-card" href="#categories"><img src="assets/Slice-7_3.png" alt="Sweet treats"></a>
                </div>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <p>© 2026 Blinkit <span aria-hidden="true">·</span> Made with <span class="heart" aria-label="love">♥</span></p>
    </footer>
</body>
</html>
